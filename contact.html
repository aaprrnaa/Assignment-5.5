
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Club | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a class="logo" href="index.html">College Club</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <section>
      <h1>Contact Us</h1>
      <p>Have a question or want to join our club? Send us a message.</p>

      <form action="#" method="post">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name"
                 placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"
                 placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="interest">Area of Interest</label>
          <select id="interest" name="interest" required>
            <option value="">Choose an interest</option>
            <option value="technical">Technical Activities</option>
            <option value="creative">Creative Projects</option>
            <option value="events">Event Management</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message"
                    placeholder="Write your message"
                    required></textarea>
        </div>

        <button class="btn" type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 College Club. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
